# loadtype.conf -- SMA load assembly type configuration file
#
#  This file consists of two integer columns, separated by white space(s). The
#  first column specifies the SMA antenna number (1-8), while the second column
#  defines the ambient load assembly type installed in the given antenna.
#  The following load assembly types are recognised:
#
#     type code       description
#     ----------------------------------------------------------------------
#     -1              Offline (no load assembly)
#     0               Old, tune6-controlled ambient load
#     1               New wSMA-style ambient load assembly
#
#  Comments may be added after the type column. These will be ignored by 
#  programs, but may be useful for humans.
#  Empty lines, or lines starting with '#' are ignored.
# ----------------------------------------------------------------------------
 
#  ant	loadtype
# ============================================================================

1	1	
2	0
3       0	# load assembly offline
4	0
5	0
6	0
7	1	# new load seembly installed
8	1

