# -----------------------------------------------------------------------------
# Example configuration file for servo.
# You can place a copy of this configuration file in
# 
#   /instance/configFiles/
#
# on the antenna computer(s), and modify values as necessary.
# updated Oct 25,2025       az.v.max to az.a.max
#                           el.v.max to el.a.max
# updated Oct 29,2025	    az a=3 v=4  el a=6 v=2                           
# ----------------------------------------------------------------------------
#
# IP-422 Serial device (if not default)
#/dev/IPOP422-0
#
# Whether to use the SynClock32 device for timing
use_synclock       1
#
# Whether to report to stderr if pacing differs by more than 10ms
report_lapses      0
#
# Enable / disable prelimit bypassing
prelimit_bypass    0
#
# Enabled / disable encoder checking
check_encoders     0
#
# [deg/s] Max azimuth slew velocity in [2.0:12.0] range
#az.v.max          4.0
#
# [deg/s] Max elevation slew velocity in [2.0:12.0] range
#el.v.max          2.0
#
# [deg/s^2] Max azimuth acceleration in [2.0:12.0] range
#az.a.max          3.0
#
# [deg/s^2] Max elevation acceleration in [2.0:12.0] range
el.a.max          6.0
#
# Mininum time (integer seconds) over which high currents must be sustained 
# before warning about it and logging it. 
current.sustain    5
#
# Az/El sustained current thresholds (amps) for warnings
az.current.warn    20.0
el.current.warn    15.0
#
# Az/El sustained current thresholds (amps) above which current is severly high
az.current.severe  40.0
el.current.severe  30.0
#
