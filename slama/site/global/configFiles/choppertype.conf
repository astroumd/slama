# choppertype.conf -- SMA chopper control type configuration file
#
#  This file consists of two columns, separated by white space(s). The
#  first column specifies the SMA antenna number (1-8), while the second column
#  defines the chopper controller type installed in the given antenna.
#  The following receiver types are recognised:
#
#     type            description
#     ----------------------------------------------------------------------
#     None            antenna has no chopper control
#     PMAC            Old, PMAC controlled chopper
#     SMA-X           New, SMA-X controlled chopper
#
#  Comments may be added after the type column. These will be ignored by 
#  programs, but may be useful for humans.
#  Empty lines, or lines starting with '#' are ignored.
# ----------------------------------------------------------------------------
 
#  ant	type
# ============================================================================

1	PMAC
2	PMAC
3	SMA-X
4	PMAC
5	PMAC
6	PMAC
7	SMA-X
8	PMAC

