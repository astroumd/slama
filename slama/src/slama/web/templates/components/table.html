<h3>{{ block.title }}</h3>
<table class="mp-table">
    <thead>
        <tr>
            <th></th>
            {% for col in block.column_labels %}
            <th>{{ col }}</th>
            {% endfor %}
        </tr>
    </thead>
    <tbody>
        {% for row in block.rows %}
        {% if row.label not in hidden_rows %}
        <tr>
            <td class="row-label">{{ row.label }}</td>
            {% for point in row.points %}
            {% set cell = cells.get(point) %}
            <td id="{{ cell.cell_id if cell else '' }}"
                class="{{ cell.css_class if cell else 'cell-nodata' }}{% if cell and cell.is_numeric %} plotable{% endif %}"
                {% if cell and cell.is_numeric %}data-canonical="{{ cell.canonical_name }}"{% endif %}>
                {{ cell.value if cell else '---' }}
            </td>
            {% endfor %}
        </tr>
        {% endif %}
        {% endfor %}
    </tbody>
</table>
