<h3>{{ block.title }}</h3>
<div class="mp-cells">
    {% for cell_def in block.cells %}
    {% set cell = cells.get(cell_def.point) %}
    <div class="standalone-cell">
        <span class="cell-label">{{ cell_def.label }}</span>
        <span id="{{ cell.cell_id if cell else '' }}"
              class="cell-value {{ cell.css_class if cell else 'cell-nodata' }}{% if cell and cell.is_numeric %} plotable{% endif %}"
              {% if cell and cell.is_numeric %}data-canonical="{{ cell.canonical_name }}"{% endif %}>
            {{ cell.value if cell else '---' }}
        </span>
    </div>
    {% endfor %}
</div>
